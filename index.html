<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f0f10">
<title>Tracker sharelink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-timer" viewBox="0 0 24 24"><line x1="10" x2="14" y1="2" y2="2"/><line x1="12" x2="15" y1="14" y2="11"/><circle cx="12" cy="14" r="8"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
</svg>

<main>
  <section id="tab-sesi">
    <div class="face">
      <svg class="ring" viewBox="0 0 288 288" aria-hidden="true">
        <circle class="track" cx="144" cy="144" r="136"/>
        <circle class="prog" id="ring" cx="144" cy="144" r="136"/>
      </svg>
      <div class="read">
        <div class="clock" id="clock">00:00:00</div>
        <div class="status" id="status"><i class="dot"></i><span id="status-text">Siap</span></div>
      </div>
    </div>

    <div class="ctrls">
      <button id="btn-main" class="primary"><svg class="ic"><use href="#i-play"/></svg><span>Mulai</span></button>
      <button id="btn-stop" class="ghost" hidden><svg class="ic"><use href="#i-stop"/></svg><span>Selesai</span></button>
    </div>

    <div class="group" id="methods">
      <button class="method" data-m="manual"><span class="add"><svg class="ic"><use href="#i-plus"/></svg></span><span class="name">Manual</span><span class="n" data-n="manual">0</span></button>
      <button class="method" data-m="gpt"><span class="add"><svg class="ic"><use href="#i-plus"/></svg></span><span class="name">IMAGE GPT</span><span class="n" data-n="gpt">0</span></button>
      <button class="method" data-m="claude"><span class="add"><svg class="ic"><use href="#i-plus"/></svg></span><span class="name">IMAGE CLAUDE</span><span class="n" data-n="claude">0</span></button>
    </div>

    <button id="btn-undo" class="link"><svg class="ic"><use href="#i-undo"/></svg><span>Batalkan tap terakhir</span></button>
    <p class="hint" id="hint"></p>
  </section>

  <section id="tab-riwayat" hidden>
    <div id="riwayat"></div>
  </section>

  <section id="tab-ringkasan" hidden>
    <div id="ringkasan"></div>
    <div class="backup">
      <h3>Cadangan data</h3>
      <p class="dim">Data tersimpan di browser ini dan hilang kalau cache dihapus atau ganti HP. Ekspor secara berkala.</p>
      <div class="ctrls">
        <button id="btn-export" class="ghost"><svg class="ic"><use href="#i-download"/></svg><span>Ekspor</span></button>
        <button id="btn-import" class="ghost"><svg class="ic"><use href="#i-upload"/></svg><span>Impor</span></button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="Halaman">
  <button role="tab" data-tab="sesi" aria-selected="true"><svg class="ic"><use href="#i-timer"/></svg><span>Sesi</span></button>
  <button role="tab" data-tab="riwayat" aria-selected="false"><svg class="ic"><use href="#i-history"/></svg><span>Riwayat</span></button>
  <button role="tab" data-tab="ringkasan" aria-selected="false"><svg class="ic"><use href="#i-chart"/></svg><span>Ringkasan</span></button>
</nav>
<script src="script.js"></script>
</body>
</html>
