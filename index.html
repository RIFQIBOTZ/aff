<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#06020f">
<title>Tracker Sharelink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@600..800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <span class="logo"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
      <span class="brand-name">Tracker Sharelink</span>
    </div>
    <p class="status" id="status">Belum jalan</p>
  </header>

  <nav class="tabs" role="tablist" aria-label="Halaman">
    <button role="tab" data-tab="sesi" aria-selected="true"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span>Sesi</span></button>
    <button role="tab" data-tab="riwayat" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Riwayat</span></button>
    <button role="tab" data-tab="ringkasan" aria-selected="false"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 20V10M12 20V4M6 20v-6"/></svg><span>Ringkasan</span></button>
  </nav>

  <section id="tab-sesi">
    <div class="readout">
      <div class="clock" id="clock" aria-live="off">00:00:00</div>
      <p class="hint" id="hint">Tekan Mulai, lalu tap metode tiap kali selesai posting satu sharelink.</p>
    </div>

    <div class="ctrls">
      <button id="btn-main" class="primary">Mulai</button>
      <button id="btn-stop" class="ghost" hidden><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13l4 4L19 7"/></svg>Selesai</button>
    </div>

    <div class="methods" id="methods">
      <button class="method manual" data-m="manual"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="name">Manual</span><span class="n" data-n="manual">0</span></button>
      <button class="method gpt" data-m="gpt"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="name">IMAGE GPT</span><span class="n" data-n="gpt">0</span></button>
      <button class="method claude" data-m="claude"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="name">IMAGE CLAUDE</span><span class="n" data-n="claude">0</span></button>
    </div>

    <button id="btn-undo" class="ghost small"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>Batalkan tap terakhir</button>
  </section>

  <section id="tab-riwayat" hidden>
    <div id="riwayat"></div>
  </section>

  <section id="tab-ringkasan" hidden>
    <div id="ringkasan"></div>
    <div class="backup">
      <h3>Cadangan data</h3>
      <p class="dim">Data tersimpan di browser ini. Kalau cache dihapus atau ganti HP, data hilang. Ekspor berkala.</p>
      <div class="ctrls">
        <button id="btn-export" class="ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Ekspor JSON</button>
        <button id="btn-import" class="ghost"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>Impor JSON</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>
<script src="script.js"></script>
<script src="fx.js"></script>
</body>
</html>
