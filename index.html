<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e27">
<title>Tracker Sharelink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body data-state="idle">
<header class="top">
  <h1 class="brand">Tracker Sharelink</h1>
  <p class="pill"><span class="dot"></span><span id="status">Belum jalan</span></p>
</header>

<main>
  <section id="tab-sesi">
    <div class="timer">
      <div class="clock" id="clock" aria-live="off">00:00:00</div>
      <p class="hint" id="hint">Tekan Mulai, lalu tap metode tiap kali selesai posting satu sharelink.</p>
    </div>

    <div class="methods" id="methods">
      <button class="method manual" data-m="manual"><span class="tile"><svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/></svg></span><span class="name">Manual</span><span class="n" data-n="manual">0</span></button>
      <button class="method gpt" data-m="gpt"><span class="tile"><svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/></svg></span><span class="name">IMAGE GPT</span><span class="n" data-n="gpt">0</span></button>
      <button class="method claude" data-m="claude"><span class="tile"><svg class="shape" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/></svg></span><span class="name">IMAGE CLAUDE</span><span class="n" data-n="claude">0</span></button>
    </div>

    <div class="ctrls">
      <button id="btn-main" class="primary">Mulai</button>
      <button id="btn-stop" class="stop" hidden>Selesai</button>
      <button id="btn-undo" class="ghost">Batalkan tap terakhir</button>
    </div>
  </section>

  <section id="tab-riwayat" hidden>
    <p class="dim cap">Isi pesanan di kolom tiap metode. Isi total klik di tiap tanggal.</p>
    <div id="riwayat"></div>
  </section>

  <section id="tab-ringkasan" hidden>
    <div id="ringkasan"></div>
    <div class="backup">
      <h2 class="sec">Cadangan data</h2>
      <p class="dim">Data tersimpan di browser ini. Kalau cache dihapus atau ganti HP, data hilang. Ekspor berkala.</p>
      <div class="ctrls">
        <button id="btn-export" class="ghost"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg>Ekspor JSON</button>
        <button id="btn-import" class="ghost"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V5m0 0L8 9m4-4l4 4M5 20h14"/></svg>Impor JSON</button>
        <input type="file" id="file-import" accept="application/json,.json" hidden>
      </div>
    </div>
  </section>
</main>

<nav class="tabs" role="tablist" aria-label="Menu utama">
  <button role="tab" data-tab="sesi" aria-selected="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.5 1.5M9.5 3h5"/></svg><span>Sesi</span></button>
  <button role="tab" data-tab="riwayat" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6"/></svg><span>Riwayat</span></button>
  <button role="tab" data-tab="ringkasan" aria-selected="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span>Ringkasan</span></button>
</nav>
<script src="script.js"></script>
</body>
</html>
